<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // math methods

        // math round(x)
        console.log(Math.round(4.896));
        console.log(Math.round(3.123));

        // math.ceil(x)
       console.log(Math.ceil(4.234));
       console.log(Math.ceil(12.6789));

    //    Math.floor(x)
       console.log(Math.floor(34.23));
       console.log(Math.floor(67.897));

    //    Math.power(x)
       console.log(Math.pow(5,3));
       console.log(Math.pow(10,3));

    //    Math.trunc(x)
       console.log(Math.trunc(100.23456));
       console.log(Math.trunc(12.3456));

    //    Math.sign(x)

       console.log(Math.sign(0));
       console.log(Math.sign(-100));
       console.log(Math.sign(100));

    //    Math.sqrt(x)
    console.log(Math.sqrt(100));
    console.log(Math.sqrt(12.456));

    // Math.abs(x)
    console.log(Math.abs(1234));
    console.log(Math.abs(-12345));

    // Math min and max()

    console.log(Math.min(12,34,-100,89,-356));
    console.log(Math.max(12,45,32,78,-45));

    // math.log

    console.log(Math.log(12));

    // math.log2

    console.log(Math.log2(20));



    </script>
</body>
</html>
